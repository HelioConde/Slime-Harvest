name: Godot headless smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import assets and compile scripts
        shell: bash
        run: |
          set -o pipefail
          godot --version
          godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource" godot-import.log; then
            exit 1
          fi
      - name: Start main scene briefly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 4 2>&1 | tee godot-smoke.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource" godot-smoke.log; then
            exit 1
          fi

      - name: Smoke test constructed scenes
        shell: bash
        run: |
          set -o pipefail
          for scene in \
            res://scenes/trees/TreeChopDemo.tscn \
            res://scenes/trees/FruitTreesDemo.tscn \
            res://scenes/world/TerrainGallery.tscn \
            res://scenes/farming/FarmingToolDemo.tscn \
            res://scenes/farming/GrowthPreview.tscn \
            res://scenes/objects/ObjectCatalog.tscn
          do
            echo "SMOKE TEST: $scene"
            godot --headless --path . --scene "$scene" --quit-after 4 2>&1 | tee godot-scene.log
            if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource" godot-scene.log; then
              exit 1
            fi
          done

      - name: Test resource gameplay (headless)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --scene res://tests/ResourceGameplayTest.tscn --quit-after 900 2>&1 | tee resource-gameplay.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|FAIL gameplay" resource-gameplay.log; then
            exit 1
          fi

      - name: Test gameplay polish (headless)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --scene res://tests/PolishGameplayTest.tscn --quit-after 1200 2>&1 | tee polish-gameplay.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|FAIL polish" polish-gameplay.log; then
            exit 1
          fi
          grep -F "PASS polish: animation timing, persistence, resource variants and collision" polish-gameplay.log

      - name: Validate fruit trees and terrain presets (headless)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --scene res://tests/FruitTerrainTest.tscn --quit-after 1200 2>&1 | tee fruit-terrain.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|FAIL fruit-terrain" fruit-terrain.log; then
            exit 1
          fi
          grep -F "PASS fruit-terrain: all four fruit trees and six terrain patches validated" fruit-terrain.log

      - name: Test main world hoe restrictions (headless)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --scene res://tests/WorldHoeTest.tscn --quit-after 900 2>&1 | tee world-hoe.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|FAIL world-hoe" world-hoe.log; then
            exit 1
          fi
          grep -F "PASS world-hoe: green-ground tilling, occupied cells, fixed house, save and load" world-hoe.log

      - name: Test removable world objects (headless)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --scene res://tests/ClearableObjectsTest.tscn --quit-after 900 2>&1 | tee clearable.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|FAIL clearable" clearable.log; then
            exit 1
          fi
          grep -F "PASS clearable: bushes logs sprouts and stumps can be cleared with original sprites" clearable.log

      - name: Test spawn limits and safe house construction (headless)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --scene res://tests/HousePlacementTest.tscn --quit-after 900 2>&1 | tee house-placement.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|FAIL house-placement" house-placement.log; then
            exit 1
          fi
          grep -F "PASS house-placement: radius, player distance and autogenerated wall safety" house-placement.log

      - name: Test pixel-perfect shoreline collision (headless)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --scene res://tests/TerrainEdgeTest.tscn --quit-after 900 2>&1 | tee terrain-edge.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|FAIL terrain-edge" terrain-edge.log; then
            exit 1
          fi
          grep -F "PASS terrain-edge: precise spritesheet shoreline physics without blocking solid land" terrain-edge.log

      - name: Test menu and updated tool atlas (headless)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --scene res://tests/MainMenuTest.tscn --quit-after 400 2>&1 | tee main-menu.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|FAIL menu" main-menu.log; then
            exit 1
          fi
          grep -F "PASS menu: functional safe entry point, future multiplayer and fourth-slot pickaxe" main-menu.log
