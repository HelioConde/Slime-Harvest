name: Alinhar sprites dos jogadores

on:
  push:
    branches: [main]
    paths:
      - "assets/Characters/masculino/*.png"
      - "assets/Characters/feminino/*.png"
      - "tools/align_player_sprites.py"
      - ".github/workflows/align-player-sprites.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-sprite-alignment
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter projeto Godot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Criar atlas alinhados a partir das novas sprites
        run: python -u tools/align_player_sprites.py

      - name: Validar recursos e quadros
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          for sex in ('masculino', 'feminino'):
              base = Path('assets/Characters') / sex / 'alinhados'
              images = list(base.glob('*.png'))
              assert len(images) == 7, (sex, len(images))
              for image in images:
                  with Image.open(image) as png:
                      assert png.size == (2560, 1280), (image, png.size)
              resource = Path('assets/Characters/animation') / f'player_{sex}_frames.tres'
              source = resource.read_text(encoding='utf-8')
              paths = re.findall(r'\[ext_resource type="Texture2D" path="res://([^"]+)"', source)
              assert len(paths) == 7 and all(Path(p).is_file() for p in paths), paths
              assert len(re.findall(r'^region = Rect2\(', source, re.M)) == 224
              assert len(re.findall(r'"name": &"', source)) == 28
              assert '[resource]' in source
              assert not any('/new/' in p or '/aligned/' in p for p in paths)
              print(f'OK {sex}: 7 atlas, 28 animacoes')
          PY
          python tools/validate_godot_project.py

      - name: Publicar atlas gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Characters/masculino/alinhados/ assets/Characters/feminino/alinhados/ assets/Characters/animation/
          if git diff --cached --quiet; then
            echo "Nenhum atlas alterado."
          else
            git commit -m "fix(player): generate aligned atlases from organized player sprites"
            git push origin HEAD:main
          fi
