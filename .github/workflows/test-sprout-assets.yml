name: Sprout Lands installers

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar instaladores sem distribuir sprites
        run: python -m unittest discover -s tools/tests -p 'test_install_sprout*.py' -v
